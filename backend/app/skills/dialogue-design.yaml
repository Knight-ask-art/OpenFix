id: builtin-skill--dialogue-design
name: 小说对话设计
summary: 依据人物声线卡、关系、议程与压力设计不可互换的对白，允许潜台词、直接表达、沉默和不完整句，避免权力句长模板。
is_enabled: true
content: |
  # 人物对白与声线
  先确认人物事实、POV、scene 功能和 Runtime Style Card。
  优先级：剧情事实与角色设定 > POV/声线/场景功能 > 项目 Style Profile
  > 通用对话偏好；与已确认文风冲突时以项目文风为准。
  对话不是说明书，也不要求每句话都推进剧情或展示金句。
  日常废话、试探、礼貌与沉默可服务关系和处境。

  ## Character Voice Card
  只从已有角色材料和已读台词提取；缺证据标未知。
  主要人物可记录：
  - 句长倾向；是否习惯说完整句。
  - 正面回答、回避、转移话题或主动解释的倾向。
  - 常用词、不会用的词与专业/地域语域。
  - 已知语域：该人物知道并能使用的词与概念范围，与“知道什么事实”分开；
    认知受限的 POV 不应突然使用其语域之外的作者词汇。
  - 反问、命令句、自嘲、打断与自我修正。
  - 高压、疲劳、悲痛时语言怎样变化。
  - 面对不同关系对象的语气差异。
  稳定声线写入已有角色档案的描述字段，
  或保存为项目笔记“人物声线卡：姓名”，沿用写入审批。
  不增加角色表字段，不把临场一次表现写成永久口癖。

  ## 设计与审查
  1. 各人当下想得到什么，愿意说什么、隐瞒什么？
  2. 目标受阻时语言怎么变：施压、回避、求助、自曝、转移或沉默。
     压力与目标绑定，不按固定“急了就吼”处理。
  3. 关系 × 场合 × 目的影响语气；不假设所有人都有同样潜台词。
  4. A 对 B 与 B 对 A 的称呼、语气与信息量不必对称：
     权力、依赖、亏欠与熟悉度不同，各自可言说的范围也不同。
  5. 根据已知材料写各自词汇、句法与关注点。
  6. 遮掉角色名，主要台词能否大致辨认说话人？
     相同立场和亲近关系可以相似，不要求每句独特。
  7. 检查台词是否复述已知信息，是否有现实沟通动机。
  8. 行业说明、坦白和说服可以成立，不一律切成半句话。
  9. 情绪依据触发与人物，不按固定四步模板。

  ## 允许不完整
  可以省主语、说半句、被打断、答非所问、转移话题、
  沉默、重复、自我修正、没说完或故意不答。
  前提是人物与场景需要；也允许完整句和直接回答。
  不随机制造口误、脏话、语气词、故意错字或乱标点。
  高压时有人克制，有人讲冷笑话，有人解释过多；
  根据已建立声线判断，不能让所有人统一爆发或统一收敛。
  突发高压（当下威胁、被质问、来不及）与长期压力
  （贫困、监视、病痛、寄人篱下、长期亏欠）作用不同：
  前者易碎裂、抢话或失控，后者多表现为磨损、客气、
  省略与习惯性回避；两种压力可同时存在。

  ## 避免新模板
  话短不等于权力上位，话长不等于软弱。
  不要求掌控者十字以内、被压制者二十字以上。
  不强制一人一口癖、不把情绪兑换成攥拳/咬唇。
  不用口癖、方言腔、结巴或标签化台词充当人物辨识度；
  方言、口音与说话习惯只在有证据时保留，不为区分角色批量设计。
  “说”是中性标签，不机械轮换或逐句加动作。
  不用突发事故替换不理想的对话，不引入未授权配角。

  ## 输出
  设计给候选台词及必要声线依据；审查只给 dialogue_voice /
  subtext / information_dump / voice_knowledge_mismatch 等 issue，
  含 location、quote_anchor、reason、goal、severity、preserve。
  只依据证据评价，不对未读台词做全书判断。
references:
  - name: 对话设计原始方法论
    content: |
      权力可表现为控制议题、解释权限、回应时机、称呼和可说范围，
      不用固定句长衡量；强者可以长篇威胁，弱者可以拒绝回答。
      同立场谈话也可校正信息或加深信任；潜台词来自不愿直说、
      关系成本与自欺，不要求每句有借口，真诚坦白可以直接。
      群像按各自所知与目标说话，不排成固定震惊阶梯。
      玩笑按人物与场合判断，高压中的防御性幽默可以存在。
      失衡→反应→内心解释→行动不能成为每轮必备结构。
      沉默、行动或迟来回应可能足够；对话量按功能，不设百分比。
  - name: Character Voice Card模板
    content: |
      character_ref: 已有角色引用
      evidence: 已读章节/段落、反例与未覆盖场景
      sentence_length: 偏短/多从句/随关系变化/未知
      completeness: 完整句/常省略/情境依赖
      answer_style: 正答/回避/转话题/先问后答
      vocabulary: 已有常用词与语域
      known_register: 人物已知并能使用的词与概念范围，与已知事实分开
      avoided_vocabulary: 有证据的不使用词，不凭身份猜测
      habits: 反问/命令/自嘲/解释/打断/自我修正
      pressure_shift: 与平常相比的变化及触发条件
      pressure_modes: acute 突发高压与 chronic 长期压力下的不同表现
      goal_under_pressure: 目标受阻时的语言变化（施压/回避/求助/自曝/转移）
      relationship_variation: 对不同对象的称呼、信息和语气
      relationship_asymmetry: A→B 与 B→A 的称呼、语气、信息量与权力差异
      确认后写已有角色描述或独立笔记，不覆盖人物事实；
      不把一次性表现固化为口癖，也不用方言腔或结巴代替人物塑造。
      Reviewer 读取相关人物，不把全体声线全文推给 Writer。
  - name: 潜台词与局部修订案例
    content: |
      “钥匙呢？”“你又要出去？”可表现回避或担心，
      也可正常询问；看双方议程与关系，不单句判错。
      “还没。”是合法回答，不扩成完整书面句。
      “我害怕。”可是一种坦白，不能一律换成冒汗或攥拳。
      遮名失败先改一个人的词汇与立场表达，
      不随机添口头禅，也不增加新情节和说话人。
