id: builtin-skill--humor-writing
name: 小说幽默写作
summary: 把幽默当作服务人物、关系与场景的功能，按人物、关系、目标、认知、压力、语境、回收与共情边界检查笑点；非喜剧项目不强行添加，不因笑点破坏已确认设定。
is_enabled: true
content: |
  # 小说幽默写作
  幽默是功能，不是装饰，也不是质量指标。
  先确认项目题材与已确认文风是否允许幽默（喜剧、轻喜剧、吐槽、冷幽默、
  黑色幽默），以及本场 scene 的功能与压力水平。
  非喜剧项目不因为“缺少笑点”报告问题，也不把幽默当作必须达成的密度。

  ## 优先级
  剧情事实与角色设定 > POV/声线/场景功能 > 项目 Style Profile 与已确认文风
  > 幽默机制 > 通用喜剧偏好。
  笑点不能改变人物知道什么、关系事实、秘密知情范围或世界规则。
  与项目文风冲突时以项目文风为准；冷幽默与热闹喜剧不混用同一批句法。

  ## 笑点从哪里来
  - 人物：笑点来自已建立的性格、认知与自欺，不是通用段子。
  - 关系：谁能开谁的玩笑由关系与权力决定；越界要有反应与代价。
  - 目标：幽默服务当前目标（缓和、试探、挑衅、掩饰、争取时间、化解尴尬）。
  - 认知：笑点建立在各自已知信息与信息差上；
    读者知道而人物不知道，是合法结构，不是欺骗读者。
  - 压力：突发高压下的防御性幽默、岔开话题、失控笑，
    与低压日常的玩笑不同；先判断压力再决定位置、长度与是否保留。
  - 语境：场合决定是否合适；仪式、告别、审讯与创伤场景按人物与功能判断。
  - 回收：建立过的梗、称呼与反差可以回调；不要求每章回收，也不无限复用。

  ## 质量维度
  新颖：不是搬运现成段子或过时网络梗；重复使用同一结构会失效。
  清晰：读者当轮能懂，不需要注解；专业梗按人物与场合处理。
  相关：与当前场景、目标、人物有关，不原地插播无关笑料。
  贴合：符合人物声线与项目文风，包括叙述者是否被允许好笑。
  时机：铺垫与落点之间的节拍决定效果；落点后不解释、不自我强调。
  共情：可以嘲弄处境、权力、自欺与荒诞，
  不靠羞辱弱者、读者或现实群体取笑。

  ## 结构与手法
  setup/undercut、直人（straight man）、逐级升级、三次法则、
  错位、反讽、冷面陈述与回调都可用，按人物与场景选择，不套固定节拍表。
  冷幽默偏克制，靠陈述、省略与留白；闹剧偏动作与连锁反应。
  同一场景不堆叠多套手法，不连续反转消耗读者信任。

  ## 禁止
  不强行添加笑话；不为笑点让人物变蠢或改变既定选择。
  不使用网络烂梗、过时流行语、方言口音、结巴、
  身体特征、性别或地域标签充当笑料。
  不因玩笑破坏已确认 canon、关系、秘密与情绪场景的落点。
  不用 Emoji、颜文字或工程说明充当幽默。
  笑点不能替代冲突、代价与状态变化，也不能掩盖本场没有推进。

  ## 输出
  issue type 可用 humor_misfire、forced_joke、tone_collision、
  humor_canon_conflict，含 severity、chapter_id、location、quote_anchor、
  reason、goal、preserve。
  喜剧项目可给候选笑点与依据，候选必须标注，不直接改正文。
  与作者意图或已确认文风冲突时以作者选择为准，记 accepted/intentional。
  无问题时结束，不要求每章有笑点。
references:
  - name: 幽默机制与结构原始方法论
    content: |
      幽默多来自预期与结果的落差：铺垫建立预期，落点打破它；
      落差要有依据，否则只是无意义的错乱。
      直人角色的功能是不懂或认真对待，从而放大对方；
      没有直人时，落差要靠叙述者或情境承担。
      逐级升级靠同一逻辑不断加码；三次法则靠第三次的变奏收束，
      生硬凑三次会显得机械。
      错位来自把 A 领域的规则用在 B 领域（正式对待琐事、琐碎对待严肃）。
      反讽要求读者能识别真实态度；识别不到就变成表述混乱。
      冷幽默靠平铺直叙与省略，把判断留给读者，落点后不加解释。
      回调建立在读者已记住的既有信息上；信息本身没建立过就不算回调。
  - name: 冷幽默与克制案例
    content: |
      “你昨天说不会再迟到了。”“今天不算。”
      可以成立：回答简短、不解释，行为与承诺的落差自带笑点。
      “他把伞收好，认真地宣布：今天谁都不许淋雨。”
      成立的前提是人物已被建立为习惯宣布无用的事。
      冷幽默不追加“这很好笑”“他觉得很好笑”这类自我说明；
      也不连续三次使用同一结构，第三次需要变奏或转向。
      叙述者可以好笑，但要有依据：叙事腔调属于作品文风，不是随机插科打诨。
      若整场没有可用的落差依据，删掉玩笑比硬凑更合适。
  - name: 幽默边界与共情
    content: |
      笑点可以指向权力、虚伪、自欺、境遇与荒谬，
      不指向弱势者的身体、口音、性别、地域、疾病与贫困。
      角色之间可以刻薄，但需符合关系与代价，不能替作者发泄。
      创作真实困境时（丧失、创伤、恐惧），幽默只在人物自己使用时出现，
      叙述者不替他们开玩笑。
      不让配角只为搞笑存在：给他们自己的目标与反应，
      否则笑点会消耗人物的可信度。
      与已确认设定冲突的梗一律放弃，宁可少一个笑点。
      项目不是喜剧时不要求幽默密度；喜剧项目也允许庄重段落。
