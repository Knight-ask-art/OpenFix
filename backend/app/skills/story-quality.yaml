id: builtin-skill--story-quality
name: 网文质量审查
summary: 按实际覆盖范围审查小说计划或正文的事实、因果、人物、叙事与自然度，输出有证据的 S1–S4 issues；项目文风先于通用门槛。
is_enabled: true
content: |
  # 小说质量审查
  评估故事文本，不评 Skill 或插件质量；审查不改写正文。
  先声明章节/卷/全书范围、已读材料、抽样与未覆盖部分，
  只有单章就不宣称全书一致或伏笔全部回收。
  剧情事实与角色设定 > POV/声线/scene 功能 > 项目 Style Profile
  > 小说自然度 > 格式 > 词句风险。
  按用户题材、目标与已确认约束判断，不套平台字数或统一网文风。

  ## 审查顺序
  1. 事实、时空、因果、人物认知、关系与世界规则。
  2. 当前计划/beat、人物目标、行动、阻力、选择、代价与状态变化。
  3. POV、psychic distance、人物声线与项目文风。
  4. 解释密度、微动作重复、节奏与过度闭环。
  5. 有功能的格式和表层重复，不因单次词语判错。
  叙事详细标准复用 narrative-deslop 的 N1–N8 与章节接口判定；
  对话复用 dialogue-design，表层复用 deslop-lexicon，
  排版以 prose-format 的戏剧单元/镜头/信息变化为准。
  references 只在当前审查范围需要时读，不默认全文加载。

  ## 判定边界
  呼吸、过渡、低压、等待与明确收束可以有叙事功能。
  不要求每章升级、强冲突、反转或金句，也不禁止所有天气开场。
  不用对话比例、心理句数、情绪标签次数作发布门槛。
  必要解释、内心经验、真实停顿和人物化比喻可保留。
  事实问题的 goal 只要求统一事实，不借机编新情节。
  修补需要新事件时标记 requires_plot_change，交回剧情设计。
  同一问题合并报告，无依据不输出 finding，不报 AI 检测分。

  ## 严重度与Verdict
  S1：破坏核心事实、因果、人物、认知、规则或读者信任。
  S2：有证据的明显叙事/人物可信度问题。
  S3：局部表达、格式、节奏或信息组织问题。
  S4：可选偏好，不阻塞通过。
  APPROVE：无 S1/S2，局部 S3 可处理。
  CONCERNS：有 S2 或成组 S3 影响阅读。
  REJECT：有 S1。
  Verdict 总是限定实际范围；缺证据不是已证实失败或通过。

  ## 输出
  scope、covered、not_covered、目标与题材、Verdict。
  自然度 risk_vector：模板词重复、解释腔、角色同声线、
  POV 漂移、节奏均匀、过度闭环、人物主动性不足；
  每维低/中/高/证据不足。
  findings/issues：id、type、severity、category、chapter_id、
  location、quote_anchor、evidence、reason/issue、goal/fix、
  preserve、requires_plot_change。
  兼容既有 severity/category/location/evidence/issue/fix，
  增加 Actor 可定位锚点与保留项，不猜 offset。
  优先 S1/S2、明确高收益 S3；偏好项单列，不无限要求重写。
references:
  - name: 审查范围、覆盖声明与评分口径
    content: |
      章节级判断本章，卷级需要连续多章，全书级需已读全书或明确覆盖材料。
      跨章问题给两处以上证据；只有大纲就评计划，不假装正文效果。
      抽样明确章节、片段、方法、未覆盖与受限结论。
      没有比较基准时将“全书人物漂移”降为观察，不用题材常识补证。
      相对评分可应用户请求给出，但不作为平台门槛或 AI 来源检测。
  - name: 通用审查标准与五维评分
    content: |
      核心一致性、表达自然度、格式可读性、场景效果、因果连贯性
      可以作诊断维度；不靠分数替代原文依据。
      目标→阻力→行动→反馈是检查线索，不是每场戏的固定模板。
      状态可因信息、关系、机会、策略或认知发生变化；
      呼吸章和日常按功能判断，不强造事件。
      高潮看已建立的读者期待与兑现，允许不同结构和延迟后果。
      内心经验和情绪命名有必要时可保留，不按句数截断。
  - name: 严重度与发布门槛
    content: |
      S1 核心事实与因果；S2 明显叙事或人物问题；
      S3 局部表达/节奏/格式；S4 可选偏好。
      有短引与位置才列 finding；无证据写证据不足。
      APPROVE/CONCERNS/REJECT 限定覆盖范围，不在多轮后放过事实错误，
      也不因偏好项阻塞交付。词频、字数和比例不是单独证据。
  - name: 网文质量检查清单
    content: |
      检查计划、人物目标和已知限制；N1–N8 用 narrative-deslop。
      认知边界与 POV：谁获知了什么，推断是否被当事实；
      关系：信任、距离与承诺是否有前文依据；
      声线：遮名后主要台词是否可辨认，关系/压力变化是否可信；
      表达：解释是否重复，动作是否无功能，节奏是否机械；
      文风：短卡、必要长句/内心/比喻是否被通用模板抹平；
      格式：戏剧单元与镜头自然断段，标点服务语气；
      结尾：是否重复总结升华预告，阶段结束是否有功能。
      未读的伏笔与远期设定不宣布回收或遗忘。
  - name: 读者契约与题材专项
    content: |
      用户已声明的卖点、关系期待与阶段目标优先。
      谁决定核心行动、谁承担后果、谁得到收益，必须依项目契约，
      群像不一律要求主角夺走全部因果与收益。
      爽文、复仇、虐文等情绪曲线只作题材参考：
      不写死冲突间隔、对话百分比、反转位置或每章高压。
      日常、慢热、治愈和呼吸场景可保留；
      延迟回收要看文本证据，不为补指标新增剧情。
