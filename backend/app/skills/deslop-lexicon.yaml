id: builtin-skill--deslop-lexicon
name: 网文禁用词与套话检查
summary: Surface Linter：识别高频模板、无功能重复与 POV 不符用词；单次命中不是错误，保留人物口头禅、术语和有功能的修辞。
is_enabled: true
content: |
  # Surface Linter：词句风险提示
  此 Skill 是表层检查工具，不是自然写作圣经。
  事实、人物、POV、声线、场景与项目文风先于词表。
  不能由命中数量推断来源，不能输出检测器分数。
  单次自然使用通常不应修改，命中某个词不等于错误。

  ## 判定流程
  1. 标出原文短锚点和所在段，不直接替换。
  2. 判断是否高频重复、模板化复现或与人物 POV 不符。
  3. 检查本句信息功能、前后文与 Runtime Style Card。
  4. 豁免角色口头禅、题材术语、引用、世界观用语、
     刻意重复、讽刺、误判和承担因果澄清的表达。
  5. 只有能说明阅读损失与修订目标时才生成 issue。
  6. 先删无用重复，再考虑在已有信息内改组织方式。

  ## 风险类目
  - 模板措辞：反复用同一精致动作承载不同情绪。
  - 解释腔：行为已显示结论，却立刻重说感受与意义。
  - 修辞堆叠：多个无功能意象遮住动作与人物。
  - 句式复现：每段相同转折、三联排比或总结。
  - 声线错位：所有人物使用同一套术语与漂亮断言。
  - 标点堆砌：停顿没有语气功能；正常中断与未尽允许。

  ## 修改边界
  不禁止全部比喻、拟人、心理、情绪标签或完整句。
  功能性、低频、属于人物经验的修辞可以保留。
  不机械轮换同义词，不把“沙哑”统一换成“低沉”。
  不将自然口头表达扩写成主谓宾完整书面句。
  不随机添加错字、脏话、语气词、动作与五感细节。
  不新增事件、人物经历或世界事实。
  发现叙事问题交 narrative-deslop，不能靠改词修因果。

  ## 输出
  使用低 / 中 / 高 / 证据不足的表层风险向量。
  每个 issue 给 location、quote_anchor、type、reason、goal、
  severity、preserve；可豁免项注明理由，正常单次用词不列错误。
  审查只提问题；Actor 执行 minimum effective edit。
  词表在“禁用词完整词表”reference，只在需要时读取。
references:
  - name: 禁用词完整词表
    content: |
      # 旧词表的风险线索（不是禁词）
      这些词句只用于查重复与语境错位，出现一次不构成 finding。
      身体动作：指节泛白、喉结滚动、攥紧拳头、嘴角勾起弧度、
      眼底闪过、唇角微勾、笑意未达眼底。
      模糊修饰：一丝、一抹、不易察觉、莫名、深深、极其、
      无比、难以形容、说不出的、复杂的情绪。
      装饰意象：惊雷炸响、受伤的小兽、心湖泛起涟漪、
      无形的大手、冰冷的刀、空气凝固。
      解释框架：他意识到、他明白、这意味着、真正的问题是、
      原来、这说明、他终于懂得、之所以……是因为……。
      结构框架：不是……而是……、既……又……、三联排比、
      事件后总结意义、金句后下章预告。
      “一声枪响”有计数功能，“沙哑”可描述嗓子或录音事实，
      “不是钥匙，是门卡”纠正误认；医生观察指节可判断循环。
      高频只是进一步检查的触发，不是严重度门槛。
      角色口头禅、证词、法规/咒语和世界术语可豁免。
  - name: 修辞与重复豁免
    content: |
      判断比喻的来源、功能、密度与语境，人物经验内的具体比喻可留；
      反复共用的华丽意象模糊人物才标出具体重复。
      讽刺、夸张与题材叙述习惯不要一律去掉。
      重复可表现犹豫、否认、口头禅和关系拉扯，
      比较前后功能，不用“出现两次”要求同义词轮换。
