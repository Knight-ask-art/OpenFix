id: builtin-skill--prose-polish
name: 文笔润色
summary: 在事实、POV、人物声线与已确认文风锁定的前提下正向提升小说语言质感：按需诊断反应因果、节拍关系、句段节奏、意象与对白，不强制反应顺序、长段比例、潜台词或修辞配额；与去模板化修订互补。
is_enabled: true
content: |
  # 文笔润色：正向提升协议 v2

  ## 目标
  让已经"正确"的文本变得"好读"：反应链符合直觉、节拍不碎、
  句法有主次、每句话都有作用、意象属于人物、对话符合场景功能。
  不追求华丽，追求准确与克制：删掉也不影响的"美句"不是加分项。
  与"网文去模板化修订"互补：deslop 负责删除模板化，本 Skill 负责正向建设。
  先跑 deslop 锁定事实与声线，再跑本 Skill；或本 Skill 之后用 deslop 做安全复核。

  ## 方法论借鉴
  本 Skill 的结构化诊断方法借鉴以下开源项目（详见文末"借鉴来源"）：
  multi-cms/human-prose 的交付前 fiction 质量门与结构化叙事规则、
  spindle/scene-writer 的 MRU（Motivation-Reaction Unit）纪律、
  ax-skills/writing-craft-coaching 的 scene/sequel 诊断、
  ai-scripts/screenwriter 的"物件代替独白"。
  借鉴的是诊断机制，不是照搬条文；裁决仍以本项目的规则优先级为准。

  ## 规则优先级
  从高到低：
  1. 剧情事实与角色设定，以及用户已确认的约束。
  2. POV / 人物声线 / 当前场景功能。
  3. 项目 Style Profile / Runtime Style Card。
  4. 小说自然度规则。
  5. 格式规则。
  6. 禁词与表层 pattern。
  低层规则与上层创作意图冲突时，保留上层并说明豁免。
  已确认项目文风优先于所有 Pass；白描、浓烈、短段和绵延长句都可保留。
  各 Pass 是可选诊断工具，不是合格小说模板，不设置修辞或句段比例配额。
  render when useful, explain when necessary：show / tell 非绝对规则，
  必要总结、直述、内心独白和情绪命名可以保留，不强制物件替代心理。

  ## 输入契约
  开始前明确：
  - 目标章节或片段位置，以及本次润色的 beat 与场景功能。
  - POV、人称和 psychic distance。
  - Runtime Style Card 和已确认用户限制。
  - 是否已跑过 deslop-writing 及其结论。
  不确定项注明缺证据，不编造。

  ## Gate 0：事实与声线锁
  润色前确认：人物在何地、做何事，已知、误解、秘密分别属于谁，
  事件顺序与人物关系。润色不得改变这些状态，不得"顺手"补设定。
  人物声线（用词习惯、句式偏好、沉默方式）是润色的边界，不是润色的对象：
  不能把糙汉的台词润成诗人。

  ## Gate 1：每句话挣位置
  逐句过一遍，问：这句话贡献了什么？
  新后果、新决定、新障碍、认知或关系变化、风险转移、人物塑造、氛围——
  至少占一样。只重复已确立事实的句子（"他确实很生气"跟在发火场面后面）
  先核是否服务人物反复确认、强调或节奏；仅无功能的重复才删或并入。
  已经证明过的东西不要再证明：第二个例子必须带来新信息，否则压缩。

  ## Pass 1：MRU 反应链
  MRU 可帮助检查刺激与反应的因果，不能据它强制排列每个反应。
  本能、行动、言语、思考可以同时、延迟、缺省；训练性反应、嘴硬、
  压抑情绪、事后觉察与有意倒叙都可能成立，不强制本能→行动→言语。
  例如先说“我没事”才察觉手抖，可以展示迟来的自我觉察，不能仅因顺序判错。
  只有因果或时间确实含混时才调整，必要刺激可隐含于已读语境。
  不为了补齐 MRU 新增微动作、感受或解释。

  ## Pass 2：节拍堆叠与句法层级
  诊断：把段落还原成节拍链，如 action → 感知 → 结果 → 反应。
  连续时刻的每一步各占一句时检查是否无意割裂因果；
  一句一拍可以服务停顿、迟疑、揭示、对白节奏与项目文风，不自动判缺陷。
  反例："他推开门。门外站着她。她手里拿着信。信封已经拆开了。"
  重建：让节拍表达关系，而不只是排队——
  "他推开门——她站在门外，手里拿着已经拆开的信封。"
  可用从句表达因果、并置表达同时、句法层级突出主要信息，
  也可保留短句、独立感知与等重并列；按人物注意力和阅读效果选择。
  注意：不是把句号机械换成逗号；新段落必须表达节拍之间的关系。
  碎片化不只适用于惊慌或冲击，不要求事后回到统一“正常节奏”。

  ## Pass 3：节奏与句读
  检查连续句子的阅读效果，长度相近可作线索，不按数量或长度判错；
  可用长短变化制造呼吸，也可保留有功能的重复节奏。关键句可独立成段；
  但不为"有节奏感"机械打碎自然长句——独白、追忆、意识流允许绵延。
  标点服务语气：该用句号处不用逗号拖行，该停顿处不硬接。
  全章段落按戏剧单元、说话人、焦点与项目文风组织，
  不要求多句叙事段占多数，不以单句段比例判定质量。

  ## Pass 4：动词与名词精度
  把"进行了X""做出了X的动作""展开了X"换成准动词。
  名词具体到可感知，但不过度列举（一桌菜不需要报全名）。
  万能动词（走、看、说、觉得）先看是否真有问题：
  功能性、无歧义的万能动词可以保留，精度只花在承载情绪的句子上。
  保留人物语言习惯中的"钝词"，不替人物"长文采"。
  程序性动作按意图压缩："他起身，开门，出去，带上门"——
  中间步骤只是物理记账时，压缩成"他出门了"；
  只有当程序制造悬念、展示专业或业余、遇到障碍、
  有仪式感或藏着发现时，才值得展开写。

  ## Pass 5：意象、比喻与物件
  意象必须来自 POV 人物的经验库：职业、地域、时代、身体状态。
  比喻密度按项目文风与场景功能，不设置一个场景 1-2 个的统一上限；
  比喻应照亮人物、体验或理解，
  不能只负责装饰。功能三问：让人物更清楚了吗？让场景更可感了吗？
  删掉它会损失什么？三问皆无则删。
  同一手法重复时检查是否机械；人物习惯、主题意象与 callback 可以保留。
  物件可替代无功能的内心总结，也可与必要的直述或独白并存。
  "她意识到自己很孤独" → "桌上摆着两副碗筷，只动过一副。"
  情绪有了载体，判断留给读者。

  ## Pass 6：对话
  潜台词：台词表面意思与真实意图的落差是张力来源。
  保留打断、沉默、答非所问；删掉替读者总结的标签
  （"他言不由衷地说""她话里有话"——有潜台词就不需要标签）。
  标签"他意味深长地说"出现时，先删标签看台词自己能不能立住；
  立不住是台词的问题，重写台词而非换标签。
  推进检查：一旦人物信息足够表态或行动，对话必须转向
  想要 / 恐惧 / 隐瞒 / 抗拒 / 决定；采访式一问一答必须挣到位置
  （权力、否认、拖延、审问等戏剧功能），否则是注水。
  允许角色讲完整句、直接坦白；不强行制造错乱。
  不要求每段对话有潜台词；闲聊、安慰、信息交换与直接表达都可成立。

  ## Pass 7：修辞模板禁令
  以下三类是 LLM 高频修辞模板，出现即审查：
  - 纠正式对比："不是愤怒，而是一种深深的无力""与其说是 X，不如说是 Y"——
    内容真需要对比才保留，不作默认修辞；
  - 装饰性三联：为显得全面而堆的三个形容词 / 三个分句，内容本没有三样东西就删；
  - 意义拔高 tack-on："这凸显了""印证了""仿佛在诉说着"——
    事实没有分析价值时不许拔高，意义让读者自己抵达。
  - 事后微评判："这下糟了""她不喜欢这样""那很重要"——
    事件本身已承载意义时删；能改变信念或引出下一个决定的才保留。

  ## Pass 8：克制
  润色后通读一遍：凡是"觉得很美但删掉也不影响"的句子，删掉。
  高光密度按已确认文风，不设每章三处上限；检查是否妨碍场景与人物。
  不制造新的微动作模板：删掉的"攥拳"不能变成批量的"揉鼻梁"。
  不把"作者管理痕迹"留在正文：解释人物为什么没做某事、
  为没发生的情节辩解时核是否必要；有功能的犹豫、权衡与伏笔可以保留。

  ## 交付前自检清单（fiction 质量门）
  交付前对同一稿内部跑一遍，不直接交 raw 初稿：
  - 连续单句段落：是否服务戏剧、声线、注意力或项目节奏？仅无功能的割裂才合并。
  - 动作-感知链：是否还有 action → 感知 → 结果 → 反应各占一句的链条？
  - 段落分布：是否符合场景功能与已确认文风？不检查长段比例。
  - 句法层级：信息关系是否清楚？从句与短句都是可选方法。
  - 对话：采访式问答是否都挣到了位置？
  - 微评判与拔高是否有叙事作用？必要解释保留，不要求清零。
  通过才交付；用户明确要 raw 草稿 / 碎片 / beat 笔记时除外。

  ## 输出协议
  交付修改后的候选文本，并在末尾附简短修改说明：
  - 每处实质修改标注对应的 Pass（如 [P1]、[P6]）与一句话理由。
  - 列出刻意保留的原句及原因（如人物声线、Style Card 要求）。
  - 不输出长篇文论，不复制整份 Skill。
  审查模式下只输出"位置 + 问题 + 改写方向"，不改正文。

  ## 何时停止
  语言达到"读得下去、不出戏"即停止；不追求"每一句都是金句"。
  只剩个人审美偏好时停止；需要新剧情或事实不明时停止相关修改。
  不与 deslop-writing 来回拉锯：有分歧时以规则优先级裁决，
  并在修改说明里写明裁决结果。

  ## 按需参考
  - MRU 与节拍堆叠案例：反应链顺序与碎片重建。
  - 意象的经验边界：POV 经验库与比喻功能检查。
  - 对话潜台词案例：标签删除与未说出口的话。
  - 借鉴来源：诊断机制借鉴以下开源项目，条文为本项目重写——
    refirelab/multi-cms human-prose（交付前质量门、结构化叙事规则、节拍堆叠、句法层级）；
    verifiedorganic/spindle scene-writer（Swain MRU 纪律）；
    xingfanxia/ax-skills writing-craft-coaching（scene/sequel 诊断）；
    gaojesse999/ai-scripts screenwriter methodology（物件代替独白）。
  只读与当前问题对应的 reference，不逐项加载全部参考。
references:
  - name: MRU 与节拍堆叠案例
    content: |
      MRU 示例（可表达迟来的自我觉察，不按顺序判错）：
      "他说'我没事'，然后才感到手在抖，最后意识到自己在害怕。"
      另一种处理（本能→行动→言语只是可选路径）：
      "他的手先抖起来。他把手插进口袋，'我没事。'"
      两种处理表达不同心理距离，依据人物与项目文风选择，不机械互换。
      节拍堆叠反例（一句一拍）：
      "他推开门。门外站着她。她手里拿着信。信封已经拆开了。"
      重建（表达关系而非排队）：
      "他推开门——她站在门外，手里拿着已经拆开的信封。"
      注意：重建不是把句号换成逗号；"他推开门，然后看到门外站着她，
      而她手里拿着信，并且信封已经拆开了"同样不合格——
      堆砌连接词不叫建立关系。
  - name: 意象的经验边界
    content: |
      渔民看云识天气、木匠听木头声音判断干湿——意象先问人物凭什么懂。
      "像被熨斗烫过的湖面"只属于用过熨斗的人。
      功能检查三问：这个比喻让人物更清楚了吗？让场景更可感了吗？
      删掉它会损失什么？三问皆无则删。
      同一本体重复先核是否有功能；不为避重复轮换同义比喻。
      物件替代可选示例："她意识到自己很孤独"
      → "桌上摆着两副碗筷，只动过一副。"
      仅比较表达效果，不把 show don't tell 当绝对规则；必要内心直述可保留。
  - name: 对话潜台词案例
    content: |
      "你最近挺忙的。"——可能是关心，也可能是"你怎么不回消息"的指责，
      潜台词由关系与前文决定，不由标签决定。
      标签"他意味深长地说"出现时，先删标签看台词自己能不能立住；
      立不住是台词的问题，不是标签的问题，重写台词而非换标签。
      沉默也是台词：该沉默处给沉默，别用"他沉默了片刻，心想……"把沉默填满。
      推进检查反例：
      "你去哪了？""图书馆。""几点回来的？""九点。""一个人？""嗯。"
      ——纯采访式问答，无戏剧功能，压缩或改写为带意图的对话。
  - name: 借鉴来源
    content: |
      本 Skill 的诊断机制借鉴以下开源项目，条文均为本项目语境重写，
      裁决以本项目规则优先级为准：
      - refirelab/multi-cms · human-prose：交付前 fiction 质量门、
        结构化叙事规则（每句挣位置、节拍堆叠、句法层级、程序压缩、
        事后微评判、意义拔高 tack-on、纠正式对比与装饰三联禁令）。
      - verifiedorganic/spindle · scene-writer：Swain MRU 纪律
        （刺激与反应的因果诊断；本项目不强制反应内部固定排序）。
      - xingfanxia/ax-skills · writing-craft-coaching：scene/sequel 诊断
        （本场景人物想要什么？是否干净利落地得到了？）。
      - gaojesse999/ai-scripts · screenwriter methodology：
        用框内物件代替内心独白。
