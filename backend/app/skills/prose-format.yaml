id: builtin-skill--prose-format
name: 小说正文格式规范
summary: 按戏剧单元、镜头与信息变化自然断段；排版和标点服从项目、人物语气与交付要求，不设固定句数或字数切刀。
is_enabled: true
content: |
  # 小说正文排版
  先看用户交付要求与项目既有样式，再使用默认建议。
  事实、POV/声线/scene 功能与项目 Style Profile 先于排版偏好。
  排版不能改变人物、剧情或语义。

  ## 段落
  按戏剧单元 / 镜头 / 信息变化自然断段。
  连续动作、推理或感知链可放同段，新焦点自然换段。
  长度只用于发现拥挤，不是固定字数切刀。
  允许较长推理、氛围和情绪链，也允许必要的单句段。
  不把动作、感官、心理机械拆成三段，不通篇等长或过碎。
  正文默认无 Markdown 装饰、无人工缩进；项目另有约定则遵守。
  换行与空行按编辑器、项目和目标格式，不为清符号改内容。

  ## 对白与标点
  默认使用项目已用的中文双引号，指定「」或其它样式可保留。
  换说话人通常另起段，同人动作与对白可织在一起。
  标签只为辨认说话人；中性“说”可用，不机械改成动作。
  省略号可以表示未尽，破折号可以表示中断；
  有真实语气功能就保留，避免无功能堆砌。
  不为了删符号添加动作、拆句或改变被打断的含义。
  问号、感叹号、逗号与句号按语气，不随机增加。

  ## 章节与 beat
  标题、字数和小节标记遵守用户或项目要求。
  未指定时延续既有格式，不规定统一章节字数。
  beat 按场景变化，不设固定子事件、对话轮数或字数。
  开头可承接动作，也可换场、交代时间或环境；
  关键是定位清楚、服务 scene，不禁止所有天气/日常开场。
  结尾可停在动作、未答对白或已有变化，不强制金句、预告或悬念。
  治愈、过渡与阶段收束按文风处理，不一律“戛然而止”。

  ## 正文边界
  章号、审稿术语、细纲指令留在标题或记录，
  不把工程说明混入故事；故事中真实讨论文本/作者身份例外。
  修格式不增重要事件、不补感官、不调角色声线。
  审查只标可定位阅读问题，修订沿用审批与 Revision。
references:
  - name: 正文格式与小节结构原始方法论
    content: |
      一段可以是连续动作链、线索发现、一轮判断或一次情绪变化。
      换焦点、物件、信息或发言人时判断是否换段。
      手机阅读可偏短，完整推理与氛围可以长；不按字数硬拆。
      感知→判断→反应可织在一起，无须逐层独立。
      段首、换场、多人或主语模糊时点名，动作链内允许代词与省略。
      普通“说”可留，重复模板妨碍声线才调整。
      “你——”被打断与“你。”意思不同，不盲删标点。
      时间跳变可简明交代，不强制三种固定写法。
      beat 功能决定长度，呼吸段不必新设事件或强钩子。
  - name: 短篇正文格式原始方法论
    content: |
      平台模板仅在用户明确要求时启用，不是小说质量门槛。
      标题可用“第X章 标题”或数字小节，引号“”或「」按约定。
      短段、单句段与稍长叙述可共存，不强制每段三句或每节固定字数。
      标点、标签和主语服从人物语气与清晰度，
      不能用动作替换全部停顿，不能让每句都“他笑了笑”。
      正文不混入多余工程说明；排版与情节修改分别交付。
