id: builtin-skill--continuity-audit
name: 长篇一致性体检
summary: 跨章增量对账：复用有来源的伏笔、人物状态、设定与时间线账本，只读取新增章节及冲突锚点，输出带双锚点的待裁定疑点，不自动修改正文或 Canon。
is_enabled: true
content: |
  # 长篇一致性体检

  ## 目标与边界

  用有来源的三本账核对跨章连续性，不凭通读印象判错。
  与“故事状态追踪”分工：它为当前写作筛选状态；本 Skill 审查已写章节。
  复用现有 Narrative State、Story Memory 与只读章节工具，不建立第二套检索。
  Reviewer 只读，不能保存账本、改正文或修改 Canon。

  ## 输入与证据优先级

  明确本次起止章、已读与未读范围、正文版本和账本基线。
  已确认 Canon 与用户明确裁定是创作约束；正文是事件与表达的证据。
  两者冲突时记录双方来源并待裁定，不自动宣布任一过期或覆盖另一方。
  区分世界事实、人物 belief、人物台词、传闻、不可靠叙述与规划。
  人物台词与不可靠叙述不自动升级为世界事实，大纲中的未来事件不算已发生。
  AI 推断、未接受候选与账本分析保留 candidate / inferred 标签。
  已确认的有意安排记 scope.accepted，附裁定来源；未覆盖不能算豁免。
  材料缺失写 evidence insufficient，不补造事实，不把账中没有当作不存在。

  ## 第一步：三本账

  每项保留 source_type、source_id、chapter_id、quote_anchor、版本或指纹、
  confidence 与确认状态；没有依据的字段留未知，不为了补齐推断。

  ### 伏笔账

  记录埋设位置、原文细节、表面意义、关联人物、推进与回收锚点。
  预计回收位置仅在作者或规划明确声明时记，否则记“未声明”。
  状态区分已埋、已推进、已回收、待裁定；长期悬置可以合法。
  不仅因超过预计章节或一批结束就判超期错误，先核对规划是否仍有效。

  ### 人物状态账

  按章只记变化点：生死、位置、伤势、能力、持有物、关系、身份。
  单独记录已知、相信、怀疑、未知、误信；不把读者知识灌给 POV。
  变化记录包含旧值、新值、触发事件与来源；未写出过渡只记证据缺口。

  ### 设定与时间线账

  记录已确认硬规则、正文确立的条件和适用范围。
  时间记录故事内日期、昼夜、年龄、事件间隔、路程耗时。
  数量记录单位、基数、库存/流量/配额及确认状态，不混用不同量。

  ## 第二步：六路对账

  Pass A 伏笔：埋设与回收细节漂移、时间倒挂、无依据宣称已回收。
  未回收和超出规划窗口只是风险线索，不强制快速回收。
  Pass B 状态：死亡后行动、伤势回滚、物件再现；先排除假死、回忆、
  非线性叙事、可靠的恢复或转交记录，不能要求每个日常动作都被写出。
  Pass C 时空：同一时间两地、已知行程与间隔冲突、年龄与日期算术。
  没有明确耗时或时间锚点时标证据不足，不猜精确距离。
  Pass D 知识：人物使用未获知信息或把猜测当事实。
  先核读可能的告知、观察、推理与误信来源，区分读者和人物知识。
  Pass E 规则：条件、代价、权限、能力或物件功能与结果不一致。
  先核适用范围和例外；未知规则不代表违规。
  Pass F 悬置：跟踪仍开放的承诺、个人线与后果。
  角色暂时不出场、批次结束无更新都不能单独构成穿帮。

  ## 分批与增量

  每批先用已有账核对新章，再产出账增量，不把可疑变化先当确认事实。
  已有账本时只读新章 + 所需账条目；冲突复核才回读锚点邻域。
  旧账的未回收伏笔和未闭合人物线继续追踪，不因超出本批而丢失。
  基线版本或指纹不匹配时只重核受影响条目，不扫描整本或整本重建。
  每批结束输出基线、覆盖范围、增量与疑点，支持中断续跑。
  不默认输出三本账全文，不用账本占满上下文。

  ## 判定与输出协议

  遵循 Reviewer 的 scope、risk_vector、issues 与 preserve 协议。
  type=consistency，每条有 severity、location、reason、goal、
  requires_plot_change 和 status=pending_adjudication。
  双锚点：quote_anchor 附前文与本章的章节定位和原文短引；
  可加 evidence_anchors 数组，分别记录 source_id、chapter_id、quote_anchor。
  一头证据不足的观察放 scope.not_covered，不伪造第二个锚点。
  reason 区分双方确立了什么、潜在解释、未覆盖证据和阅读影响。
  goal 是需要作者裁定的问题，可附最小修订方向，不预设改正文或改 Canon。
  preserve 包含不可改的事实、认知、关系、声线和信息边界。
  S1/S2 为有证据的重大疑似冲突；S3 为局部或累积风险；S4 为偏好。
  未裁定的重大 S1/S2 或影响阅读的成组 S3 不能记 passed=true；
  仍可交付草稿与报告，但必须说明待裁定，不混同“已交付”与“审查通过”。
  纯证据不足写未覆盖，不为凑清单打回；只剩偏好就停止。

  账本附录优先输出 ledger_delta，注明 baseline 与新条目 provenance。
  账本是非 Canon 分析材料，不是小说正文或确定事实。
  调度方保存项目笔记必须走已有写入审批，未批准只能返回候选附录；
  笔记保存不等于 Canon 确认，禁止自动写入 Fact / Belief / Plotline。
  作者确认有意安排后记 accepted；确认穿帮后才交 Actor 最小修订。
  需要新增事件、改关系或剧情时 requires_plot_change=true，交回 Planner。

  ## 纪律

  不用未来知识倒灌早期人物认知，非线性叙事按故事时间核对。
  同一冲突只立一项，相关位置附后；不重复多路报告。
  不用“完全自洽”代替证据，不将文学偏好当事实错误。
references:
  - name: 伏笔清账检查表
    content: |
      核埋设和回收双锚点、细节与故事时间。
      回收窗口未声明就不猜；长期悬置不自动算错误。
      已声明窗口先核作者是否调整；疑点保留待裁定。
  - name: 人物状态对账检查表
    content: |
      核变化来源、伤势恢复、物件转交、地点与时间。
      世界事实与人物信念分开，优先查告知和观察证据。
      缺过渡、缺记录不等于不可能；没有双锚点标证据不足。
