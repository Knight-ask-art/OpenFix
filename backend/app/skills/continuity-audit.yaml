id: builtin-skill--continuity-audit
name: 长篇一致性体检
summary: 跨多章对账检查：先从正文建伏笔、人物状态、设定与时间线三本账，再逐章核对死人复活、状态回滚、伏笔超期与倒挂、知识越界、时间线冲突，按章节输出带双锚点证据的疑似矛盾清单，只呈现证据、等待裁定。
is_enabled: true
content: |
  # 长篇一致性体检：对账协议

  ## 目标与边界

  本 Skill 解决长篇独有的问题：单章审查看不见的跨章穿帮。
  方法是先把散落在正文里的事实落成三本账，再逐章拿正文与账对，
  而不是凭印象通读后说"感觉前后不一"。

  与"故事状态追踪"分工：状态追踪负责在写作时筛选当前所需状态、维护快照；
  本 Skill 负责在一段章节写完后做系统对账，产出问题清单。
  已有状态快照或追踪材料时以它为账的起点，但账与正文冲突时以正文原文为准，
  并把账本身标注为过期，不静默改账迎合正文。

  本 Skill 只呈现疑似矛盾与证据，不做文学裁决：
  疑点可能是穿帮，也可能是作者有意的误导、伏笔伪装或不可靠叙述。
  每条疑点标"待裁定"，由作者决定改前文、改本章或确认有意为之。

  ## 输入契约

  开始前明确：
  - 本次体检的章节范围（起止章），以及范围外已读、未读的部分。
  - 可用的既有材料：状态快照、大纲中的伏笔规划、世界观设定、人物卡。
  - 作者已确认的有意安排（如假死、身份伪装、叙述者撒谎），先记入豁免清单，
    命中豁免的疑点不进清单，只在覆盖说明里提及。

  材料缺失时先从正文本身建账；建不出账的检查路直接标未覆盖，不推断。

  ## 第一步：建三本账

  账只记正文确立的事实，每条必带出处章节，不记分析判断。
  事实来源优先级：正文原文 > 人工确认的叙事状态资料 > 大纲与规划；
  后两类与正文冲突时以正文为准，并把该资料条目标注为过期，
  仍以正文锚点立项，不拿资料当证据直接判冲突。

  ### 伏笔账

  每条伏笔至少记：埋设章、埋设时的原文关键细节、表面意义、
  预计回收位置（大纲或正文有声明才记，没有就记"未声明"，不替作者规划）、
  当前状态（已埋 / 已推进 / 已回收 / 已超期）、关联人物。
  埋设时没有记下原文细节，后面就无从判断回收是否漂移，所以细节必须抄原句要点。

  ### 人物状态账

  按章只记变化点，不逐章重抄全表。关键字段：
  生死、位置、伤势与身体状态、能力档位、关键持有物、
  与主要角色的关系状态、已知信息（明确知道的关键事实）、对外身份与称谓。
  变化点格式：{章}：{角色} {字段} {旧值} → {新值}，触发事件 {一句话}。

  ### 设定与时间线账

  - 硬规则：力量体系、社会规则、地理与交通耗时、组织规矩等正文已确立、
    后文不能违反的约束，各带出处章。
  - 时间锚点：故事内日期、季节、昼夜、角色年龄、事件间隔、
    路程耗时等可算术核对的量，各带出处章。

  ## 第二步：六路对账

  逐章过正文，与三本账核对。命中以下任一形态才立项，
  只有"感觉不对"而指不出两方证据的，不立项，放未覆盖说明。

  ### Pass A：伏笔清账

  - 超期未回收：已越过预计回收位置仍无推进，或全书已完结仍悬置。
  - 伏笔倒挂：回收出现在埋设之前。
  - 凭空回收：正文宣称回收了一条账上不存在的伏笔。
  - 细节漂移：回收时的关键细节（物件、话语、场景）与埋设原文不符。

  ### Pass B：生死与状态

  - 死人复活：已确立死亡的角色其后以活人身份行动，且无复活、假死揭晓等交代。
  - 状态回滚：伤势、能力、身份、处境无因退回旧值（如重伤未愈却无交代地痊愈）。
  - 持有物幽灵：已消耗、遗失、被夺的物品再次被使用；
    或角色使用了从未获得的物品与资源。

  ### Pass C：位置与时间线

  - 瞬移：角色在两地的出现间隔短于设定账已确立的路程耗时。
  - 分身：同一角色在同一时间出现在两处。
  - 算术冲突：年龄、日期、间隔天数前后对不上；季节、昼夜与事件顺序冲突。

  ### Pass D：知识边界

  - 角色说出或用出其按人物状态账尚不知道的信息，且无获知场景。
  - 叙述把只有读者或他人知道的真相，当作该角色已知事实驱动其行动。

  ### Pass E：设定规则

  - 行为结果违反设定账硬规则（如已确立的代价、限制、条件被无视）。
  - 能力、权限、物品功能被提前使用（尚未解锁）。
  - 同一条规则对不同角色给出不同结果，且正文无解释。

  ### Pass F：悬置与消失

  - 主要角色（多次出场、有独立剧情线者）长期消失且无任何交代，
    记录其最后出场章与未闭合的个人线。
  - 已明确承诺的目标、约定、代价在本章范围结束时仍无状态更新。

  ## 分批与增量

  长篇一次读不完时按批处理，不硬塞上下文：

  - 分批建账：按顺序分批读入章节（每批以能完整读完为准），
    每批只记本批的账增量并入总账，后一批建账时只读新章 + 已有总账，
    不重读前面批次的正文（冲突复核需要时才回读锚点段落）。
  - 分批对账：每批正文先与总账对账再并入增量，
    这样冲突在本批进入账本之前就暴露，而不是全书读完才发现。
  - 增量体检：已有上次体检留下的账本时，只对新增章节建账与对账，
    旧账条目不重新核读原文；但旧账里标"未回收"的伏笔、
    "未闭合"的人物线必须在本轮 Pass A / Pass F 中继续追踪，
    不能因不在本轮章节范围内就丢掉。
  - 中断可续：每批结束时输出该批账增量与本批疑点，
    中断后凭账增量续跑，不从第一章重来。

  ## 严重度映射

  - S1：两方证据直接冲突的事实穿帮（Pass A 倒挂、B、C、D、E 的实锤项）。
  - S2：有证据的状态不一致，但可能存在于未读章节的解释
    （须注明"解释可能在第 X 章前后，未覆盖"）。
  - S3：伏笔超期、悬置、角色消失等风险项，尚不构成事实冲突；
    多条同类 S3 成组出现时，说明其对读者信任的累积影响。
  - 是否 passed 仍按 Reviewer 既有判定规则，本 Skill 不另设标准。

  ## 输出协议

  输出按章节分组的问题清单，遵循 Reviewer 的 issue 字段，
  type 一律用 consistency，并做两点强化：

  - 双锚点：quote_anchor 同时给出前文锚点与本章锚点，
    格式为 前文[第 X 章·场景]："原文短引" ／ 本章[第 Y 章·场景]："原文短引"，
    只给一头证据的不立项。
  - 账本附录：清单末尾附本次体检后的三本账全文（或相对上次账本的增量，
    并注明基线），供调度方保存为项目材料、下次体检直接作起点；
    本 Skill 只读不落盘，附录是给调度方的交付物，不是正文的一部分。
  - reason 写清冲突两方分别确立了什么、差在哪；
    若疑点有"作者有意安排"的可能读法，在 reason 末尾注明
    "待裁定：也可能为有意安排"，不替作者判定。
  - goal 写需要裁定的问题本身（如"确认第 12 章的痊愈是否有意跳过交代"），
    穿帮成立时的最小修订方向可附其后，但不预设结论。
  - preserve 照常填写：裁定与修订时不能动摇的事实、认知与关系。

  清单之外附覆盖说明：本次读了哪些章、哪几路 Pass 因材料不足未覆盖、
  命中了哪些豁免项。未覆盖不等于没有问题，不写成结论。

  ## 纪律

  - 状态截止到体检范围末尾，不用范围外信息倒灌判定范围内的章节。
  - 不把账本、表格或检查说明写进小说正文。
  - 不补写正文没有的事实来"修复"矛盾；修复是裁定之后的事。
  - 同一矛盾只立一项，在最早出现冲突的章节定位，其余章节列为关联位置。
  - 找不到双锚点的观察一律放未覆盖，不为凑清单立项。

  ## 方法论借鉴

  本 Skill 的对账机制借鉴以下开源项目（借鉴机制，条文为原创）：
  Xiaoyangy/novel-studio 的逐章审核与一致性闭环、世界状态与 POV 知识分离；
  huangziyuan-general/dsh-novel-forge 的写后落账纪律、
  伏笔埋设必带回收计划与超期预警、全书一致性体检；
  shuozhe-liang/novel-create-skill 的伏笔台账状态机、动态状态表
  与体检清单（伏笔清账 / 角色消失 / 时间线校验）；
  AI_NovelGenerator 的一致性审校（设定、角色状态、摘要、
  未解决冲突与新章五方材料比对）。
references:
  - name: 伏笔清账检查表
    content: |
      - 账上每条伏笔是否有埋设章与原文关键细节？
      - 预计回收位置已过的，是否仍无推进？记为超期。
      - 本次范围内的每次回收，埋设是否都在账上、且在回收之前？
      - 回收时的物件、话语、场景细节与埋设原文逐项对得上吗？
      - 已回收伏笔是否真的改变了人物目标、关系、资源或认知？
  - name: 人物状态对账检查表
    content: |
      - 已死亡角色其后是否再出场？出场方式与死亡交代是否冲突？
      - 伤势、能力、身份的变化点是否都有触发事件？
      - 角色本章使用的物品与信息，在状态账里是否有获得记录？
      - 角色当前所在位置与上一位置之间的路程耗时是否成立？
      - 主要角色最后出场在哪一章？其个人线是否闭合或有交代？
