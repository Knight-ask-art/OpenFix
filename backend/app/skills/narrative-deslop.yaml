id: builtin-skill--narrative-deslop
name: 小说叙事去模板化
summary: 用 N1–N8 检查人物主动性、阻力、选择、代价、状态变化、认知边界、解释密度与过度闭环；证据不足不判错，不擅自新增剧情。
is_enabled: true
content: |
  # Narrative Deslop
  检查故事本身的模板化，不用词汇命中替代叙事判断。
  可用于 Story/Plot 预检、成稿审查与局部修订后的复核。
  先明确已读范围、当前 scene/beat、POV、人物目标和 Style。
  优先级：剧情事实与角色设定 > POV/声线/场景功能 >
  项目 Style Profile > 小说自然度 > 格式 > 表层 pattern。
  无证据不报告错误；不强迫每场戏满足八项、不强造剧情障碍。

  ## N1 — Character Agency
  人物想要什么，为什么现在行动，是否作出主动选择？
  风险：答案自动送到面前；人物只接收事件；
  去某处只有作者需求，缺少人物处境或目标依据。
  被迫、等待和无法选择也可成立，检查可见的应对与抵抗。
  人物犯错可以有主动性，不要求他做最正确选择。

  ## N2 — Resistance
  目标受阻是否有具体来源：他人立场、信息缺失、规则、
  时间、现实条件、自身误判或关系成本？
  风险：“想查就查到、想问就全说、想逃就逃掉、人正好出现”。
  已有能力足以解决小事时不必强加阻力。
  修订不能为增加阻力新增无关事件或障碍人物。

  ## N3 — Choice
  当前选择是否属于角色，而非只有作者预设的一条合理路？
  比较文本已有选项的收益、代价与人物价值排序。
  迫不得已只有一个选项可是真实处境，不机械凑 A/B。
  若更换选择才可修复，标记 requires_plot_change=true。

  ## N4 — Cost
  选择带来的关系、时间、机会、情绪、暴露、身份或现实代价，
  是否在已有行为与结果里可见？
  不用“他知道自己付出巨大代价”代替后果。
  后果可以延迟，标注待兑现与已发生，不能捏造损失。
  低风险场景允许没有重大代价。

  ## N5 — Irreversible Change
  重要 scene/beat 结束后，信息、关系、机会、承诺、秘密、
  误会、目标或策略是否至少发生一项有意义的变化？
  不要求每场都大反转；细小变化、失去选项也成立。
  呼吸、过渡与重复仪式按功能标记不适用，不判无效。
  风险是文字很长，却无信息、状态或体验上的必要变化。

  ## N6 — Knowledge Boundary
  人物怎样得知当前信息？是看见、听见、被告知还是推断？
  不得精确理解别人的秘密动机或未经历的事件。
  猜错、误解、偏见、自欺与信息不完整可以保留。
  猜测不能忽然变成全知事实，叙述者不代他宣布答案。
  全知叙述依据项目人称检查，有意设计不算漂移。

  ## N7 — Interpretation Density
  事件后是否立刻解释情绪、动机与意义？
  “他意识到、他明白、这意味着、真正的问题是、原来、
  这说明、他这才懂得、他终于明白、之所以……是因为……”
  只作风险提示。读者能从动作、对白、物件、结果拼出的部分，
  可减少解释；必要因果、人物误判和独特内心经验允许。
  不把所有心理独白都改成行为。

  ## N8 — Tidy Closure
  是否反复“冲突→理解→成长→总结意义→金句→下章预告”？
  允许问题未解、情绪未命名、话没有回应、动作做到一半，
  现实后果先出现，意义以后再说。
  阶段性结束、治愈和明确答案有叙事功能时保留。
  不能为了不闭环把每章强行截断或新增钩子。

  ## POV 与 Psychic Distance
  显著描写经过当前 POV 人物过滤：
  为什么这个人物此刻注意它，来自什么目标、经验或压力？
  职业只提供线索，不套固定职业细节菜单。
  同一 scene 的远近距离应稳定，或有可辨认的设计过渡。
  远景→贴身感官→作者评价→他人心理的无意识跳转才是风险。
  比喻也需属于人物经验；不是禁止全部修辞。

  ## 输出与协作
  每项状态：PASS / WARN / FAIL / 不适用 / 证据不足。
  只按实读范围下结论；不要把单章推广为全书。
  风险向量：人物主动性不足、认知越界、POV 漂移、
  解释腔、过度闭环，各用低/中/高/证据不足。
  issue 使用 type、severity、chapter_id、location、quote_anchor、
  reason、goal、preserve、requires_plot_change。
  同一缺陷影响多个 Gate 时合并一个 issue，避免重复修。
  Reviewer 不改正文；Actor 只做已有事实内的最小有效修改。
  requires_plot_change=true 的问题交回 Story/Plot，不用补动作解决。
  无实质问题就结束，不为凑齐清单制造错误。
references:
  - name: Narrative Gates场景案例
    content: |
      她要找资料，陌生人恰好递来：查交付动机与铺垫；
      若缺失，定位 N1/N2，不新增跟踪者、丢文件或追杀。
      她只能在期限前签字：可以是真实压迫，查可见应对与已有代价，
      不必硬造其它选项。两人喝茶不说话：
      关系压力、维持表面和平可成立，必要呼吸场景标 N5 不适用。
      人物误认为别人撒谎：保留偏见，区分人物判断与叙述事实。
  - name: POV与认知证据检查
    content: |
      记录 POV、获知途径与未获知事实；未知只写不确定。
      同一人物平时看价格，遇险看出口，不按职业添五感。
      原文没有的证据不能补写。叙述距离可有意拉远换场，
      无设计进入别人内心才是风险。修改后确认秘密知情范围、
      误解与事实仍区分，时间与关系未变。
  - name: 叙事风险与局部修订协议
    content: |
      位置用章节引用+段落+短引；offset 只有工具核实才使用。
      严重度依据故事后果，不由词频和检测分数决定。
      叙事重构与局部表达修订分开，不靠添动作修选择失效。
      成稿流程：Narrative Review → Surface Review → Actor → Final Review。
      同一 Reviewer 可一轮先叙事后表层，避免重复读全文；
      Story/Plot 可先预检，已有成稿不重新编故事。
