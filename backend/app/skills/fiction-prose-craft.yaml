id: builtin-skill--fiction-prose-craft
name: 小说文笔工艺
summary: 在事实、POV 与项目文风之下处理渲染与说明、叙述距离、节奏、选择性细节与功能性比喻；不设绝对化的展示优先，不强制短句、微动作或比喻。
is_enabled: true
content: |
  # 小说文笔工艺
  本 Skill 处理“怎么写”，不处理“写什么”。
  先确认已读范围、当前 scene/beat、POV、人物目标与已确认项目文风，
  再判断表达取舍；剧情事实、人物设定与结构问题交 narrative-deslop 与剧情设计。

  ## 优先级
  剧情事实与角色设定 > POV/声线/场景功能 > 项目 Style Profile 与已确认文风
  > 文笔工艺 > 通用写作偏好。
  与项目文风冲突时以项目文风为准；本 Skill 只给有条件的取舍，不给统一模板。
  无证据不判错，同一缺陷只报一次，不与 POV、声线、格式重复计。

  ## 渲染与说明
  该渲染处渲染，该说明处说明：依据是本场功能与读者当下需要，
  不是“所有心理都要变成动作”。
  需要读者切身经历（危险、亲密、失控、感官冲击）时可放慢、贴住 POV；
  需要读者快速获得结论（时间跨度、前情、战术与规则交代、结果）时可直接说明。
  允许“他害怕”“她松了口气”这类直接标注；
  克制叙述、反讽与文体化说明同样合法。
  不设绝对化的“展示优先”：不用微动作替换全部情绪命名，
  也不把说明一律改写成感官堆叠；两种手段按功能分配。

  ## 叙述距离
  psychic distance 是乐器而非规矩：同一 scene 内可以近、可以远，
  但要有可辨认的设计（换人、换场、时间跳变、情绪冲击）。
  无意识滑进他人内心或无依据的全知评价才是风险。
  距离拉远不等于偷懒，贴身也不等于更好；选择后保持可读与稳定。

  ## 节奏
  句长、段长与停顿随信息密度与情绪曲线变化，
  允许长句、复句、排比、单句成段与连续短句共存。
  不强制短句，不禁止长句，不设每段句数或每句字数切刀。
  重复可以是节奏手段（强调、仪式、回声、压迫感），
  只有无功能的重复才是风险；先确认它想制造什么效果。
  快慢由场景决定：追击与崩点可短促，回忆、权衡与告别可舒展。

  ## 选择性细节
  细节取舍取决于人物此刻的注意力与目标，不要求每件事物都承载象征。
  同一物件在不同处境可以被看见、被忽略或只被扫过，这是选择性而非疏漏。
  必要的过程细节与氛围铺陈可以保留；
  删减只针对无功能、重复或与 POV 无关的部分。
  修订不新增原文没有的感官、物件或动作来“补足画面”。

  ## 功能性比喻
  比喻服务人物经验、处境与认知：先问这个人物此刻会拿什么作比。
  允许比喻存在，也允许直白表达；不按密度判错，也不强制添加。
  不为文艺叠加修辞，不用与人物世界无关的典雅意象填充。

  ## 场景进出
  可以后进（late in）、早出（early out），也可以正常进入与收束。
  依据是本场功能与读者需要，不是固定公式。
  不为“立刻入戏”删掉必要的处境交代，也不为完整把结尾拖到无意义处。
  过渡、呼吸与阶段收束按项目文风处理，不一律截断或加钩子。

  ## 输出
  审查只给 issue：type 可用 prose_craft、rendering_gap、distance_shift、
  selective_detail、metaphor_mismatch、uniform_rhythm，
  含 severity、chapter_id、location、quote_anchor、reason、goal、preserve。
  只按实读范围评价，不把单章偏好推广为全书规则。
  作者有意选择或项目已确认的风格偏离记 accepted/intentional，不改写成通用模板。
  需要改事实、选择或结构才能解决的，标记 requires_plot_change 交回剧情设计。
  无实质问题就结束，不为凑清单制造偏好项。
references:
  - name: 文笔工艺原始方法论
    content: |
      叙述距离是一条连续带：作者概括、人物外部行为、人物语言、
      人物思绪、无意识联想都在这条带上；选择位置看读者当下需要。
      说明与渲染不是对立面：说明压缩时间交代结论，
      渲染放慢让读者经历过程；两者比例按场景功能调整，不设配额。
      节奏由句法、句长、段长与停顿共同构成，
      长句可制造堆叠与失控，短句可制造断裂；同一作品允许并存。
      选择性细节的依据是人物注意力、目标与经验，
      不是“越多越真实”，也不是“越少越高级”。
      比喻的功能是把陌生经验接到熟悉经验上；
      本体与喻体跨度过大、或与人物世界无关时读者会出戏。
      重复作为手法时承载强调、仪式与回声；无新信息的重复才是冗余。
  - name: 渲染与说明取舍案例
    content: |
      “他害怕。”是直接标注，可以成立；
      若本场功能是让读者经历他的失控，可改写为身体与判断的失序，
      但不必删除全部命名，也不必逐句改成动作。
      十年时间跨度用一段说明压缩是合理选择；
      同段若同时要读者体验等待的漫长，再展开具体几日。
      雨可以只作天气，也可以承担情绪，取决于 POV 是否真的在意它；
      不因为出现过一次就要求后续每场雨都有意义。
      慢镜头适合关键动作与濒临失去的瞬间，
      连续慢镜头会消耗张力；快进适合重复劳动与已知流程。
      删减先找无功能的重复与视角外信息，不从“句子太长”开始。
  - name: 修辞、细节与修订边界
    content: |
      修订不新增原文没有的感官、道具、天气或动作，
      不能为了让画面“更文学”而改变人物知道什么、做过什么。
      文体化叙述（冷峻、讽喻、疏离、口语）是合法文风，
      不以“解释太多”或“不够展示”为由统一改写。
      直白、留白、长句、短句、比喻与说明各有功能，
      审查只指出与当前 scene 功能冲突的具体段落，不判定整体风格高低。
      作者有意保留的重复、距离变化与未解释意象记 accepted，
      多轮修订后不再重复提出同类偏好。
