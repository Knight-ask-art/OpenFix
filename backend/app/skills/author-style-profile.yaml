id: builtin-skill--author-style-profile
name: 文风样本分析
summary: 从用户提供的样本文本提炼分层文风档案：区分稳定、情境依赖与不确定特征，附置信度与证据位置，可选出写作约束建议，不做作者身份判断，也不覆盖正文。
is_enabled: true
content: |
  # 文风样本分析：从样例提炼可复用风格档案

  输入是当前会话中用户提供或明确授权的样本文本：用户自己的旧稿、用户选定的目标风格样例、或其他用户有权处理的文本。输出是一份分层、带置信度和证据位置的文风档案，以及可选的写作约束建议。

  本 Skill 只做风格描述，不做作品评价，不做作者身份判断，不改写正文。风格判断只覆盖用户实际提供的样本；样本不完整时必须声明抽样范围。

  ## 一、基本原则

  1. 只用已提供的样本。样本数量、字数、章节或片段边界、是否节选都要在输出中写明；缺样本的维度列入未覆盖，不用印象或体裁常识补全。
  2. 结论必须分层并带置信度。稳定特征、情境依赖特征、不确定特征分开写，每条附证据位置。
  3. 不做身份判断。不输出“这是某位作者的作品”“模仿某位作者”“某位作者的风格”这类结论；用户自己给出的标签只作为用户标注引用，不作为分析结论。
  4. 不复制样本措辞。证据只引用定位所需的最短片段（一行以内），档案中的示例必须自己重写为中性示例或只写结构，不摘录标志性句子、独特比喻、专名和成段原文。
  5. 区分内容与风格。剧情、人物、设定、桥段属于内容，不作为风格特征；只有可复用的表达习惯和组织方式进入档案。
  6. 不套外部标准。不使用平台字数、更新节奏、钩子时长、爽点间隔或固定评分惯例，也不输出总分和等级。
  7. 只给建议，不动正文。档案和写作约束默认只是建议，不自动套用；不得覆盖正文、大纲、CANON 或草稿。

  ## 二、分析流程

  ### 1. 确认样本与目标

  - 样本来源与范围：哪些章节或片段、大致字数、是否节选、是否只提供片段。
  - 体裁与目标读者：用户声明优先；用户未声明时只写文本内部可判断的依据，写不出就写未声明。
  - 用户目标：分析自己的旧稿、统一多份稿件的语气、参考目标样例写新稿、还是单纯做风格分析。后续口径按目标确定。
  - 未覆盖部分与因此受限的判断。

  ### 2. 观察维度

  | 维度 | 观察内容 |
  |---|---|
  | 叙述视角与距离 | 人称、视角限制、叙述者与人物内心的距离、视角是否切换 |
  | 句式与节奏 | 长短句分布、短句群出现的位置、句子平均长度倾向 |
  | 段落与场景切换 | 换段依据、场景过渡方式、时间跳跃的处理 |
  | 标点与语气 | 对话标点、停顿方式、感叹与问号的使用频率和位置 |
  | 词汇与语域 | 口语或书面倾向、行业词、方言、文言残留、抽象词密度 |
  | 修辞与意象 | 比喻的来源域、感官偏好、重复出现的物件或意象 |
  | 对话处理 | 对话比重、标签方式（动作标签或言语标签）、潜台词密度、人物声线差异 |
  | 信息释放 | 先因后果或先果后因、解释密度、留白与补叙的使用 |
  | 情绪表达 | 用动作和后果承载，还是直接命名情绪；强度和克制程度 |
  | 章节开合 | 开头入场方式、结尾落点类型、章内钩子的处理方式 |

  每个维度记录三项：出现位置、在样本中出现的范围或次数、以及反例。反例要如实记录，不能只挑支持结论的例子。

  ### 3. 特征分层

  | 分层 | 判定条件 | 处理方式 |
  |---|---|---|
  | 稳定特征 | 在多数样本中反复出现，跨场景成立，且已检查反例 | 可进入写作约束 |
  | 情境依赖特征 | 只在特定类型场景出现（对话、战斗、抒情、过渡），或与体裁惯例高度重合 | 写明触发条件，不写成全局习惯 |
  | 不确定特征 | 只出现一两次、样本过少、或与其他样本冲突 | 只作观察记录，不进入写作约束 |

  体裁惯例必须单独标注。多数同体裁文本都会出现的写法（例如某类文本必需的解释段或特定叙述体）属于体裁特征，不是样本的个人特征。

  ### 4. 置信度标尺

  | 置信度 | 条件 |
  |---|---|
  | 高 | 多个样本反复出现，跨场景成立，已检查反例 |
  | 中 | 部分样本出现，或与体裁相关但在样本范围内一致 |
  | 低 | 单次出现、样本不足，或与其他样本冲突 |

  置信度必须附证据位置。证据不足时写“证据不足”，不靠印象补；同一特征在不同样本表现不一致时，置信度按低处理并记录冲突。

  ### 5. 证据与抽样纪律

  - 每条特征给出样本编号或章节、片段位置；跨样本特征至少给出两处证据。
  - 样本不完整时声明抽样范围，写明哪些特征只是局部观察。
  - 统计类描述（句长倾向、对话比重）只作参考量级，用“偏短/偏长/接近均衡”“对话占比较高”这类相对表述，不换算成平台门槛或合格线。
  - 需要对照才能成立的特征（例如“比常见写法更克制”）必须写明比较基准来自哪里；没有基准就降为观察项。

  ## 三、输出档案结构

  - 样本范围与抽样说明：已分析样本、未覆盖部分
  - 体裁、目标读者与判断依据
  - 稳定特征：特征、置信度、证据位置
  - 情境依赖特征：特征、触发条件、置信度、证据位置
  - 不确定特征：观察记录、不确定原因
  - 体裁特征与个人特征的区分说明
  - 未覆盖维度与限制
  - 可复用风格摘要：3-7 条中性描述，不含样本原句
  - 可选写作约束：见第四节，默认只是建议

  档案中的示例句式必须自己重写为中性示例（例如“结构：短句起手承接动作，再接一句较长因果句”），不出现样本的标志性措辞。

  ## 四、可选写作约束

  写作约束是给用户自己写作或 AI 生成时参考的建议文本，必须满足：

  - 只描述可操作的表达习惯：句式、节奏、段落、标点、对话标签、信息释放顺序、情绪落地方式。
  - 只从稳定特征，以及已写明触发条件的情境依赖特征生成；不引用不确定特征。
  - 每条注明来源特征和置信度。
  - 写成可选建议，不写成唯一正确写法，也不与该体裁的必要写法冲突。
  - 不包含样本的独特措辞、专名、桥段和事件顺序。
  - 不包含平台字数、更新节奏、钩子时长、评分门槛等外部规则。

  建议格式：

  ```text
  约束：对话多用动作标签，避免连续使用同一个言语标签。
  来源：稳定特征-对话处理（置信度：高；证据：样本 2 第 3 节、样本 4 第 1 节）
  适用条件：多人在场且情绪升高的场景；平静叙述段可不套用。
  ```

  应用边界：

  - 约束默认只作为建议输出，不自动套用。
  - 需要落到正文时，必须由用户确认；不得覆盖正文、CANON 或草稿。
  - 用户要求按约束改写时，只改用户指定的范围，保留原意、信息和事实。

  ## 五、禁止事项

  | 禁止 | 原因 | 替代做法 |
  |---|---|---|
  | 断言作品归属或模仿某位真人作者 | 样本不足以支持身份结论 | 只写文本内可见的表达特征 |
  | 把体裁惯例写成个人风格 | 会误导后续写作 | 单独标注为体裁特征 |
  | 把单次用词或个别句子当习惯 | 样本不足 | 降为不确定特征 |
  | 摘录标志性原句或独特桥段 | 涉及复制而非分析 | 只写结构，示例自行重写 |
  | 输出总分、等级或平台适配结论 | 风格分析不产生评分 | 改为分层特征描述与置信度 |
  | 直接改写或覆盖正文 | 需用户确认，且不属于本 Skill 范围 | 只输出建议约束 |

  ## 六、最终输出模板

  - 样本范围与抽样说明：
  - 体裁、目标读者与依据：
  - 稳定特征：
    - 特征：
    - 置信度：高 / 中 / 低
    - 证据位置：
  - 情境依赖特征：
    - 特征：
    - 触发条件：
    - 置信度：
    - 证据位置：
  - 不确定特征：
    - 观察：
    - 不确定原因：
  - 体裁特征与个人特征的区分：
  - 未覆盖维度与限制：
  - 可复用风格摘要：
  - 可选写作约束：
  - 是否已按约束修改正文：未修改（默认）

references:
  - name: 文风观察维度与记录方法
    content: |
      观察维度：叙述视角与距离、句式与节奏、段落与场景切换、标点与语气、词汇与语域、修辞与意象、对话处理、信息释放、情绪表达、章节开合。

      每个维度记录出现位置、在样本中出现的范围或次数、以及反例。反例必须如实记录，不能只挑支持结论的例子。句长、对话比重等统计描述只作参考量级，用偏短、偏长、接近均衡这类相对表述，不换算成平台门槛或合格线。

      风格与内容分开：剧情、人物、设定、桥段属于内容，不作为风格特征。只有可复用的表达习惯和组织方式进入档案。样本中反复出现的独特专名、标志性句子和独特比喻只用于定位，不作为档案内容复制。

  - name: 特征分层、置信度与证据纪律
    content: |
      分层：稳定特征为多数样本反复出现、跨场景成立且已检查反例；情境依赖特征为只在特定类型场景出现或与体裁惯例高度重合，必须写明触发条件；不确定特征为单次出现、样本过少或与其他样本冲突，只作观察记录。

      置信度：高为多个样本反复出现、跨场景成立、已检查反例；中为部分样本出现或与体裁相关但在样本范围内一致；低为单次出现、样本不足或与其他样本冲突。每条特征附证据位置；跨样本特征至少两处证据；证据不足写“证据不足”，不靠印象补。

      抽样纪律：写明已分析样本、是否节选、未覆盖部分，以及哪些特征只是局部观察。需要对照才能成立的特征必须写明比较基准；缺基准就降为观察项。体裁惯例单独标注，不写成个人风格。

      身份边界：不输出作品归属、作者身份或模仿某位真人作者的结论；用户自己给出的标签只作为用户标注引用。

  - name: 写作约束生成与边界
    content: |
      约束只从稳定特征和已写明触发条件的情境依赖特征生成；不引用不确定特征。每条约束注明来源特征、置信度、证据位置和适用条件，写成可选建议而不是唯一正确写法，也不与该体裁的必要写法冲突。

      约束内容限于可操作的表达习惯：句式、节奏、段落、标点、对话标签、信息释放顺序、情绪落地方式。不包含样本的独特措辞、专名、桥段和事件顺序，也不包含平台字数、更新节奏、钩子时长、评分门槛等外部规则。

      应用边界：约束默认只作为建议输出，不自动套用；需要落到正文时由用户确认，不得覆盖正文、CANON 或草稿；按约束改写时只改用户指定范围，保留原意、信息和事实。
