id: builtin-skill--deslop-writing
name: 网文去模板化修订
summary: 按事实、POV、人物声线和项目文风做最小有效修订，先叙事后表层；保留自然单次用词，不用另一套模板替代原稿。
is_enabled: true
content: |
  # 小说去模板化：核心执行协议

  ## 目标
  让文本保有人物的需要、误判、选择和表达习惯。
  处理可定位的模板化问题，不追求某种统一网文腔。
  不以 AI 检测分数、禁词命中量或删除比例评价作品。
  这个 Skill 负责修订方法；叙事诊断交给 narrative-deslop，
  表层风险由 deslop-lexicon 辅助，格式以 prose-format 为准。

  ## 范围与授权
  - 只处理用户指定的章节、片段或 Reviewer issue。
  - 先确认是审查、建议改写，还是已授权工具修订。
  - 审查模式只输出问题，不改正文。
  - 缺少事实依据时读必要章节、人物、设定或笔记。
  - 已在当前上下文明确的信息不重复读取。
  - 不为展示能力扩展到未授权章节或整本书。
  - 没有问题的原句可以原样保留。

  ## 规则优先级
  从高到低：
  1. 剧情事实与角色设定，以及用户已确认的约束。
  2. POV / 人物声线 / 当前场景功能。
  3. 项目 Style Profile / Runtime Style Card。
  4. 小说自然度规则。
  5. 格式规则。
  6. 禁词与表层 pattern。
  低层规则与上层创作意图冲突时，保留上层并说明豁免。
  用户明确的交付格式应遵守；调整排版不能偷改内容事实。

  ## 输入契约
  开始前明确以下已知信息：
  - 目标章节或片段位置。
  - 当前任务与 beat，人物目标和场景功能。
  - POV、人称和 psychic distance。
  - 相关人物认知、关系状态与世界规则。
  - Runtime Style Card 和已确认用户限制。
  - 若有 Reviewer issues：type、location、quote_anchor、reason、goal。
  不确定项注明缺证据，不编造完整档案。

  ## Gate 0：事实与原意锁
  修订前列出此次触及的事实，不输出整份背景复述：
  - 谁在什么地点，正在做什么。
  - 已知、猜测、误解与秘密分别属于谁。
  - 原文事件顺序、人物关系和决定。
  - 本段尚未完成的目标、承诺与后果。
  修改不得暗中改变这些状态。
  若诊断需要新事件或不同选择，只给情节层建议，
  由用户或剧情设计流程决定，不能伪装成表层润色。

  ## Pass 1：Narrative
  先检查人物目标、主动性、阻力、选择、代价与状态变化。
  有叙事层问题时按需激活 narrative-deslop。
  不强迫每场戏有大冲突、反转、成长或完整闭环。
  呼吸、等待、关系停滞和误解都可有叙事功能。
  只解释“当前文本哪里失效”，不套固定剧情公式。

  ## Gate 1：POV 过滤
  每个显著细节都问：这个人物此刻为什么会注意它？
  细节应来自职业、欲望、担忧、经验或当下感官。
  POV 人物没有看到、听到或获知的事实不能当作已知。
  推断可以出现，但要保留不确定性与人物偏见。
  不替别人解释隐藏动机，不把猜测写成作者答案。
  有意的全知叙述按项目人称处理，不强改为限知。

  ## Gate 2：Psychic Distance
  同一 scene 的叙述距离保持可辨认。
  检查远景旁白、贴身感官、作者评价、别人心理之间的跳转。
  只有无依据的漂移才是问题。
  有意拉远、贴近或换 POV 时保留过渡与原设计。
  不为“代入感”机械补心跳、呼吸和五感扫描。

  ## Pass 2：Voice 与表达
  按人物声线、关系对象、场合和压力判断对白。
  允许省略、半句话、打断、沉默、回避和自我修正。
  也允许角色讲完整句、直接回答或长篇解释。
  不随机给每个人加语气词、脏话、口误或错字。
  隐去说话人后，主要台词应有可辨认的立场和语言选择。
  角色口头禅可保留；不要用轮换同义词假装差异。

  ## Gate 3：解释密度
  检查动作或对白之后是否立刻复述情绪和意义。
  “他明白”“这意味着”等只作风险线索，命中不等于错。
  读者能从已有结果推知的解释优先删减。
  保留影响因果理解、认知边界或人物误判的内心判断。
  不把所有心理句都改成外部动作。

  ## Gate 4：修辞与具体性
  保留低频、功能性、人物经验内的比喻和拟人。
  删除无功能堆叠、跨声线装饰和复用模板时说明依据。
  具体并不等于越多越好。
  原文没有的物件、伤口、经历和感官信息不能凭空补出。
  不强制每段加细节，不把每句情绪标签都兑换成微动作。

  ## Gate 5：节奏与闭环
  句段按戏剧单元、镜头和信息变化组织。
  不以固定句数、字数切段，不把全部长句打碎。
  对话标签服务说话人辨认，普通“说”无需换花样。
  检查机械的“事件→理解→成长→金句→预告”收束。
  允许未答的话、未完成动作和延迟出现的意义。
  也允许符合文风的阶段结束，不强造悬念。

  ## Pass 3：Surface Lint
  只在叙事、POV 和声线正确之后做词句检查。
  按需激活 deslop-lexicon；不把全文词表装进 Writer。
  单次自然使用通常保留。
  高频重复需区分模板、口头禅、题材术语、引用与世界用语。
  优先删去无用重复，或在既有信息内换组织方式。
  禁止机械轮换同义词，禁止以词频直接判断严重度。

  ## Pass 4：Minimum Effective Edit
  以明确 issue span 及必要前后邻域为单位。
  定位优先使用章节引用、段落编号和原文短锚点。
  最小有效修改：删一处解释即可解决时不重写一段。
  修一段可解决时不重写整章。
  锚点有重名或已变化时先确认位置，不能盲目替换。
  不为了句式多样而改掉自然重复或人物停顿。
  不增加重要事件、关系变化、动机或世界设定。
  大纲层问题与正文层问题分开报告。
  写入沿用当前审批 / Diff / Revision 流程。

  ## Pass 5：局部验证
  对照目标、前后段及受影响的相邻台词检查：
  - 事实、关系、事件顺序和角色认知没有改变。
  - POV 与叙述距离延续，指代可辨认。
  - 人物声线和 Runtime Style Card 未被抹平。
  - 句段读起来顺，标点表达真实语气。
  - 原 issue 被解决，未制造新微动作模板或解释句。
  - 未越界到其它章节，未添加新事件。
  验证未读到的远期剧情时说明范围，不宣称全书一致。

  ## 输出协议
  审查返回风险向量与 issues，不返回“AI 味 72 分”。
  风险维度：模板词重复、解释腔、角色同声线、POV 漂移、
  节奏均匀、过度闭环、人物主动性不足。
  每维用低 / 中 / 高 / 证据不足，并附必要的短证据。
  issue 至少包含：
  - type、severity、chapter_id（未知时为空）。
  - location：scene / paragraph 等可定位位置。
  - quote_anchor：来自原文的短引，重名时加邻域。
  - reason：为什么妨碍本项目当前场景。
  - goal：期望解决的问题，不能只是“更自然”。
  - preserve：事实、声线或关系等保留项。
  - requires_plot_change：是否超出局部语言修订。
  修订交付列出已处理 issue、未处理原因与修改范围。
  用户要求只看改稿时可直接给候选文本，内部验证仍须做。
  不输出未要求的长分析，不复制整份 Skill。

  ## 何时停止
  有证据的问题已解决且局部验证通过就停止。
  仅剩审美偏好或收益很小的改动，不继续磨掉作者个性。
  需要新剧情、事实不明或锚点歧义时停止相关修改。
  不因上一轮“未过”自动扩大改写范围。
  Final Review 只复核已修问题与相邻一致性；
  新发现的独立问题单列，不无限增加审稿轮次。

  ## 按需参考
  - 去AI味完整指南：路由与修订案例的总索引。
  - POV与叙述距离：注意力过滤、认知和有意过渡。
  - 表层模式与最小修订案例：删除解释、标签与修辞豁免。
  - 局部修订交付协议：可定位 issue、事实锁与停止条件。
  只读与当前问题对应的 reference，不逐项加载全部参考。
references:
  - name: 去AI味完整指南
    content: |
      # 去模板化指南与参考索引
      先锁原文事实，再处理叙事、POV、声线、表达，最后表层词句与排版。
      不按词频分成“重度 AI”或按删除百分比决定修订量。
      无证据的问题不改；平台要求仅在用户指定该平台时使用。
      narrative-deslop 负责 N1–N8，dialogue-design 负责声线与潜台词；
      prose-format 负责排版，deslop-lexicon 只是 Surface Linter。
      视角问题读“POV与叙述距离”；解释与模板词读“表层模式与最小修订案例”；
      多 Agent 传递任务读“局部修订交付协议”。
      “她把钥匙收回。他明白，她不想让他再来。”
      如果视角确有此判断且影响决定可以保留；只是命名已显露的拒绝，
      删后一句即可，不增加握拳、叹气或争吵回忆。
      单次“沙哑”可能是生病、职业或录音事实，保留。
      多场戏都用“声音沙哑 + 指节发白”替换不同情绪，
      才检查是否丢掉人物特有行为；没有材料就先删冗余。
      单次“不是……而是……”可澄清误认，不能改掉逻辑。
      引用、口头禅、术语和世界书用语允许豁免。
  - name: POV与叙述距离
    content: |
      警察看出口、木匠看接缝、医生看呼吸只作为可能的注意力依据，
      不是职业描写菜单。医生欠房租也可能先看价格。
      先读人物目标、经验与压力，再判断细节。
      POV 不知道的信息可作猜测，不能精确揭露别人秘密。
      自由间接引语可贴近人物；人称与距离是不同概念。
      明确全知叙述或 scene 切换可保留；无依据的跳转才修。
      限知视角未得知搬家决定时，“她早已决定搬走”越界，
      可删除或保留已有猜测，不能捏造“搬家的纸箱”证明答案。
  - name: 表层模式与最小修订案例
    content: |
      “这说明”“他终于明白”先查有无新认知；有误判或因果作用可保留。
      连续攥拳、喉结滚动、指节发白不能改成揉鼻子的新微动作模板。
      人物经验内的低频比喻可留；多重修辞遮住事件才减少。
      “还没。”是成立的回答，不扩成完整主谓宾。
      真实中断可用破折号，未尽可用省略号；
      不为去符号增加打断动作。无功能堆砌才减。
      同一感知链别拆三段，新信息可独立成段。
      “我害怕”可能是坦白或谈判，不能一律改成心跳、冒汗。
  - name: 局部修订交付协议
    content: |
      Reviewer 给 chapter_id、location、quote_anchor、type、severity、
      reason、goal、preserve、requires_plot_change，不猜字符坐标。
      Actor 定位原文及邻域，沿用已有编辑工具和审批。
      锚点不唯一或文本已改先确认，不全局替换同名台词。
      能删一处则只删一处，需要新事件则交回剧情设计。
      Final Review 复核 issue、事实、认知、关系、声线与指代，
      不每轮增加偏好项，解决问题即可停止。
