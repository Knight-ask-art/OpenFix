appId: com.openfix.app
productName: OpenFix
copyright: Copyright © 2026 OpenFix contributors. Based on OpenFic by Syrize.

directories:
  output: dist-electron

# OpenFix has no release feed yet. Keep updates pointed at a dead endpoint so the
# packaged app-update.yml never falls back to the upstream OpenFic GitHub releases.
publish:
  provider: generic
  url: http://127.0.0.1:0/disabled-openfix-updates

electronLanguages:
  - en-US
  - zh-CN

files:
  - dist/**/*
  - package.json

extraResources:
  - from: ../frontend/dist
    to: frontend-dist
    filter:
      - "**/*"
  - from: resources/app-update.yml
    to: app-update.yml

win:
  icon: resources/icons/openfix.svg
  artifactName: OpenFix-${version}-win-${arch}.${ext}
  target:
    - nsis
    - zip

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  artifactName: OpenFix-${version}-win-${arch}-setup.${ext}

mac:
  icon: resources/icons/openfix.svg
  artifactName: OpenFix-${version}-mac-${arch}.${ext}
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  identity: null

linux:
  icon: resources/icons
  artifactName: OpenFix-${version}-linux-${arch}.${ext}
  synopsis: An AI writing workbench for long-form fiction
  description: OpenFix is a Windows-first AI writing workbench for long-form fiction, based on OpenFic.
  maintainer: Syrize <syrize@qq.com>
  vendor: syrizelink
  target:
    - AppImage
    - tar.gz
  category: Utility
