appId: com.openfix.app
productName: OpenFix
copyright: Copyright © 2026 OpenFix contributors. Based on OpenFic by Syrize.

directories:
  output: dist-electron

# This block is the only source of the packaged update feed: electron-builder
# writes resources/app-update.yml itself in its afterPack hook, which runs after
# extraResources have been copied, so a repo copy under resources/ never reaches
# the installer. useMultipleRangeRequest cannot be declared here for the GitHub
# provider (the publish schema rejects unknown properties, so packaging would
# abort) and does not need to be: electron-updater forces single range requests
# for GitHub feeds. Only a generic feed honours the option, which is why
# electron-builder.local-update.yml declares it there.
publish:
  provider: github
  owner: Knight-ask-art
  repo: OpenFix
  releaseType: release

electronLanguages:
  - en-US
  - zh-CN

files:
  - dist/**/*
  - package.json

extraResources:
  # No app-update.yml entry: electron-builder generates resources/app-update.yml
  # from the publish block above and overwrites anything copied from resources/.
  - from: ../frontend/dist
    to: frontend-dist
    filter:
      - "**/*"
  - from: backend-wheel
    to: backend-wheel
    filter:
      - "openfic-*.whl"
      - "uv.gz"
      - "uv.exe.gz"

win:
  icon: ../frontend/public/openfix-logo.png
  artifactName: OpenFix-${version}-win-${arch}.${ext}
  target:
    - nsis
    - zip

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
  artifactName: OpenFix-${version}-win-${arch}-setup.${ext}

mac:
  icon: ../frontend/public/openfix-logo.png
  artifactName: OpenFix-${version}-mac-${arch}.${ext}
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  identity: null

linux:
  icon: ../frontend/public/openfix-logo.png
  artifactName: OpenFix-${version}-linux-${arch}.${ext}
  synopsis: An AI writing workbench for long-form fiction
  description: OpenFix is a Windows-first AI writing workbench for long-form fiction, based on OpenFic.
  maintainer: Syrize <syrize@qq.com>
  vendor: syrizelink
  target:
    - AppImage
    - tar.gz
  category: Utility
